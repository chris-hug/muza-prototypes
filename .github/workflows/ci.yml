# Three gates, cheapest first.
#
# `doc-sweep` needs no dependencies and runs in about a second, so it reports
# before the other two have finished installing. `typecheck` and `build` are
# the ordinary ones — they exist because a prototype that ships from `main`
# has no other moment where somebody notices the app stopped compiling.
#
# The coverage half of the Component Doc Pass, enforced.
#
# `doc-sweep` greps every component in src/components/ui for the design
# system's shared vocabulary — motion and state, touch and pointer — and fails
# when something is in the code and absent from that component's doc. An
# undocumented behaviour is one nobody is checking, and the failure mode this
# gates against is slow: a component gains a gesture, its doc goes on
# describing the version before it, and the next person reads the doc.
#
# It carries a baseline of pre-existing gaps (see scripts/doc-sweep.mjs), so a
# red run means something NEW went undocumented, not that the repo has debt.
#
# What this cannot catch: a doc that is confidently wrong about a number. That
# is the consistency half of the pass, and it needs a reader.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first — the sweep has nothing to say about a
# commit that is already replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-sweep:
    name: Component docs cover the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned rather than inherited: the sweep is plain ESM against node's
      # standard library, and 22 is the LTS the runners will keep. v4 of these
      # actions still targets node 20, which the runners now force onto 24 and
      # annotate every run about.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # No install step: the sweep reads files and uses nothing but node's own
      # standard library. Keeping it dependency-free is what makes it a
      # second-long check rather than a two-minute one.
      - name: npm run doc-sweep
        run: node scripts/doc-sweep.mjs

      # The system file's contract lines are generated from the pages that own
      # each rule. This fails when a page's `contract:` moved and nobody re-ran
      # the generator — the drift that used to be silent, because two prose
      # copies of one fact pass every grep.
      - name: npm run sync-docs -- --check
        run: node scripts/sync-system-doc.mjs --check

      # The one that points at the CODE: does the app obey the contract the
      # docs state? The three above all check documents against documents.
      - name: npm run conformance
        run: node scripts/conformance.mjs

  typecheck:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      # `react-router typegen` writes the generated route types the app
      # imports; without it a clean checkout fails on files that are correct.
      - run: npx react-router typegen
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Full history: `prebuild` unshallows so the built page can stamp itself
      # with HEAD's date (scripts/release.mjs). Fetching it here is cheaper and
      # quieter than letting the build shell out for it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npm run build
